[package]
name = "ping"
version = "1.0.0"
edition = "2021"
authors = ["bend-n <bend.n@outlook.com>"]
repository = "https://github.com/bend-n/monitorkit"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.97"
termion = "4.0.4"
grapher = { path = "../grapher" }
ping-rs = "0.1.2"
oneshot = { version = "0.1.11", default-features = false, features = ["std"] }


[[bin]]
name = "ping"
doc = false
path = "src/ping.rs"
