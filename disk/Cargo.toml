[package]
name = "disk"
version = "1.0.0"
edition = "2024"
authors = ["bend-n <bend.n@outlook.com>"]
repository = "https://github.com/bend-n/monitorkit"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.97"
termion = "4.0.4"
grapher = { path = "../grapher" }
ping-rs = "0.1.2"
oneshot = { version = "0.1.11", default-features = false, features = ["std"] }
libc = "0.2.171"
atools = "0.1.6"
implicit-fn = "0.1.0"
collar = "1.0.1"
human_bytes = "0.4.3"


[[bin]]
name = "disk"
doc = false
path = "src/disk.rs"
